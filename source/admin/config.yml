# Decap CMS
# · 本地：先运行 npm run cms:proxy（或 npm run dev:admin），再打开 http://localhost:4001/admin
# · 线上：GitHub 登录需本仓库 functions/auth + callback（Cloudflare Pages）及环境变量，见 README「Decap 线上登录」
# local_backend 仅在 localhost 生效，部署后仍走 GitHub 登录，不会访问 127.0.0.1
# · 全站 YAML（名称/外观/界面文案/留言墙）合并为一份 site_cms.yml，一次保存即可一并提交

backend:
  name: github
  repo: mason-z/blog
  branch: main
  # 勿用默认 api.netlify.com（Cloudflare 上会 404）。须与浏览器打开后台的域名一致（含自定义域）
  base_url: https://masonblog.pages.dev
  auth_endpoint: auth

# 为 true 时，仅在浏览器访问 localhost / 127.0.0.1 时走本机 decap-server（默认端口 8081），线上仍用 GitHub
local_backend: true

media_folder: source/images/uploads
public_folder: /images/uploads

# 与 Decap 默认媒体库共用：ascii 会去掉非拉丁字符，中文文件名会变成「.mp3」；unicode 保留 UTF-8 文件名
slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: posts
    label: 博客文章
    label_singular: 文章
    folder: source/_posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: 标题, name: title, widget: string }
      - label: 发布日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: HH:mm:ss
      - label: 更新日期
        name: updated
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: HH:mm:ss
        required: false
      - label: 分类
        name: categories
        widget: list
        default: ["随笔"]
        field: { label: 项, name: category, widget: string }
      - label: 标签
        name: tags
        widget: list
        field: { label: 项, name: tag, widget: string }
      - label: 封面图 URL
        name: cover
        widget: string
        required: false
        hint: "可选；与主题 post-card 封面一致"
      - label: 置顶权重（sticky）
        name: sticky
        widget: number
        default: 0
        value_type: int
        required: false
        hint: "0 表示不置顶；大于 0 时在首页/分类/标签/归档等列表靠前，数字越大越靠前（Hexo 原生字段）。"
      - label: 正文（摘要可用 <!-- more --> 分隔）
        name: body
        widget: markdown

  - name: travel_map
    label: 旅行地图
    description: 管理地图上的城市标点及与博文的关联；保存后需重新执行 hexo generate（本地预览可 hexo server --watch）
    files:
      - label: 城市与博文
        name: travel_data
        file: source/_data/travel.yml
        format: yaml
        fields:
          - label: 城市列表
            name: cities
            widget: list
            summary: "{{fields.name}} → {{fields.url}}"
            fields:
              - { label: 城市名, name: name, widget: string }
              - label: 置顶
                name: pinned
                widget: boolean
                default: false
                required: false
                hint: "开启后排在侧栏与地图标注列表最前；多条置顶时仍按「旅行时间」字符串降序。"
              - { label: 纬度, name: lat, widget: number, value_type: float, step: 0.0001, hint: "北纬为正，如 39.90" }
              - { label: 经度, name: lng, widget: number, value_type: float, step: 0.0001, hint: "东经为正，如 116.40" }
              - { label: 旅行时间（展示用）, name: date, widget: string, required: false, hint: "如 2024-01，可空" }
              - { label: 备注, name: note, widget: string, required: false }
              - label: 关联博文路径
                name: url
                widget: string
                required: false
                hint: "与站点内文章地址一致，无域名。发布文章后从浏览器复制路径段，如 2026/04/01/hello-hexo/；不填则仅标点、不跳转博文"

  - name: music_share_timeline
    label: 音乐时间轴
    description: 唯一音乐数据源：/music-share/ 时间轴展示心情与文字；顶栏音符播放器自动播放**按时间最新一条、且已填写音频**的分享。保存后需重新构建站点。
    files:
      - label: 分享条目
        name: music_share_data
        file: source/_data/music_share_timeline.yml
        format: yaml
        fields:
          - label: 条目（页面按日期从新到旧排序）
            name: entries
            widget: list
            summary: "{{fields.date}} · {{fields.song_title}}{{fields.file}}"
            fields:
              - label: 分享时间
                name: date
                widget: datetime
                date_format: YYYY-MM-DD
                time_format: HH:mm
                hint: "想记录的那一天与时间"
              - label: 置顶
                name: pinned
                widget: boolean
                default: false
                required: false
                hint: "开启后排在时间轴最前；多条置顶时仍按时间从新到旧。顶栏播放器仍按「日期最新 + 有音频」选取，不受此项影响。"
              - label: 歌曲名（可选）
                name: song_title
                widget: string
                required: false
                hint: "可不填：留空时与顶栏一致，自动用上传文件名（去扩展名）或外链路径末段；仅在与文件名不同的展示名时填写。"
              - label: 音频外链（HTTPS 直链）
                name: url
                widget: string
                required: false
                hint: "与上传二选一；均填写时优先使用上传文件。"
              - label: 上传音频
                name: file
                widget: file
                required: false
                hint: "mp3/m4a 等，与全站媒体同一 uploads 目录。"
              - label: 天气（可选）
                name: weather
                widget: select
                required: false
                default: ""
                hint: "下拉选择；不选则时间轴不显示天气。选项已带 emoji。若旧数据是手写的，保存时请改选一项或选「不选」。"
                options:
                  - { label: "— 不选 —", value: "" }
                  - { label: "☀️ 晴", value: "☀️ 晴" }
                  - { label: "⛅ 多云", value: "⛅ 多云" }
                  - { label: "☁️ 阴", value: "☁️ 阴" }
                  - { label: "🌫️ 雾 / 霾", value: "🌫️ 雾" }
                  - { label: "🌦️ 阵雨", value: "🌦️ 阵雨" }
                  - { label: "🌧️ 雨", value: "🌧️ 雨" }
                  - { label: "⛈️ 雷雨", value: "⛈️ 雷雨" }
                  - { label: "❄️ 雪", value: "❄️ 雪" }
                  - { label: "🌬️ 大风", value: "🌬️ 大风" }
                  - { label: "🌙 晴夜", value: "🌙 晴夜" }
              - label: 心情（可选）
                name: mood
                widget: select
                required: false
                default: ""
                hint: "下拉选择；不选则不显示心情。"
                options:
                  - { label: "— 不选 —", value: "" }
                  - { label: "😊 开心", value: "😊 开心" }
                  - { label: "😌 平静", value: "😌 平静" }
                  - { label: "🥰 温柔 / 喜欢", value: "🥰 温柔" }
                  - { label: "🤩 兴奋", value: "🤩 兴奋" }
                  - { label: "☕ 慵懒", value: "☕ 慵懒" }
                  - { label: "🌿 轻松", value: "🌿 轻松" }
                  - { label: "💭 放空", value: "💭 放空" }
                  - { label: "🎵 随音乐晃", value: "🎵 随音乐" }
                  - { label: "😢 低落", value: "😢 低落" }
                  - { label: "😤 烦躁", value: "😤 烦躁" }
                  - { label: "🥱 疲惫", value: "🥱 疲惫" }
                  - { label: "💼 充实", value: "💼 充实" }
                  - { label: "🤔 纠结", value: "🤔 纠结" }
              - label: 地点（可选）
                name: location
                widget: select
                required: false
                default: ""
                hint: "下拉选择；不选则不显示地点。网页后台不能动态增选项——若要加「广州」「店名」等，请在仓库里编辑 source/admin/config.yml，在本字段的 options 下增加一行：- { label: 显示名, value: 保存到页面的文字 }，保存后重新构建站点。"
                options:
                  - { label: "— 不选 —", value: "" }
                  - { label: "深圳", value: "深圳" }
                  - { label: "河南", value: "河南" }
                  - { label: "北京", value: "北京" }
                  - { label: "上海", value: "上海" }
                  - { label: "广州", value: "广州" }
                  - { label: "杭州", value: "杭州" }
                  - { label: "成都", value: "成都" }
                  - { label: "香港", value: "香港" }
                  - { label: "澳门", value: "澳门" }
                  - { label: "台北", value: "台北" }
              - label: 动态正文（Markdown）
                name: note
                widget: markdown
                required: false
                hint: "像朋友圈一样写一段话；支持 Markdown。天气与心情请用上方的下拉框选择。"

  - name: pets_timeline
    label: 宠物时间轴
    description: /pets/ 页面时间轴；照片存于全站 uploads。npm run build 会自动压缩 uploads 内超过 100KB 的图片；保存后需重新构建站点。
    files:
      - label: 宠物记录
        name: pets_data
        file: source/_data/pets_timeline.yml
        format: yaml
        fields:
          - label: 条目（按日期从新到旧展示）
            name: entries
            widget: list
            summary: "{{fields.date}}"
            fields:
              - label: 时间
                name: date
                widget: datetime
                date_format: YYYY-MM-DD
                time_format: HH:mm
                hint: "记录这一刻的日期与时间"
              - label: 置顶
                name: pinned
                widget: boolean
                default: false
                required: false
                hint: "开启后排在时间轴最前；多条置顶时仍按时间从新到旧。"
              - label: 照片
                name: photo
                widget: image
                required: true
                hint: "建议宽度适中；构建站点（npm run build）时会自动把 uploads 里超过 100KB 的图压到约 100KB 以下。也可手动执行 npm run compress:pet-images。"
              - label: 配文（Markdown）
                name: note
                widget: markdown
                required: false
                hint: "一小段话，支持 Markdown。"

  - name: news_timeline
    label: 近况时间轴
    description: /news/ 页面时间轴；纯文字动态，支持 Markdown。保存后需重新构建站点。
    files:
      - label: 近况记录
        name: news_data
        file: source/_data/news_timeline.yml
        format: yaml
        fields:
          - label: 条目（按日期从新到旧展示）
            name: entries
            widget: list
            summary: "{{fields.date}}"
            fields:
              - label: 时间
                name: date
                widget: datetime
                date_format: YYYY-MM-DD
                time_format: HH:mm
                hint: "本条近况的日期与时间"
              - label: 置顶
                name: pinned
                widget: boolean
                default: false
                required: false
                hint: "开启后排在列表最前；多条置顶时仍按时间从新到旧。"
              - label: 正文（Markdown）
                name: note
                widget: markdown
                required: false
                hint: "支持标题、列表等 Markdown。"

  - name: site_and_pages
    label: 全站与独立页面
    description: "「站点配置」合并网站名称、外观、全站文案与留言墙后端，保存一次即可；下方为各独立页面的 Markdown。"
    files:
      - label: 站点配置（名称 / 外观 / 界面文案 / 留言墙）
        name: site_cms
        file: source/_data/site_cms.yml
        format: yaml
        fields:
          - label: 一、站点名称（顶栏与标题后缀）
            name: site_name
            widget: object
            collapsed: false
            fields:
              - label: 网站名称
                name: name
                widget: string
                hint: "显示在顶栏左上角，以及各页浏览器标签中的「页面 | 网站名」。修改后请重新生成站点（hexo generate 或托管平台自动构建）。"
          - label: 二、网站外观（首页标题、导航、页脚）
            name: theme
            widget: object
            collapsed: false
            fields:
              - label: 顶栏品牌名（备用）
                name: brand
                widget: string
                required: false
                hint: "若已在上一节填写站点名称，顶栏优先显示站点名称；此处为未设置时的后备"
              - { label: 首页主标题, name: landing_title, widget: string }
              - { label: 首页引言, name: landing_lead, widget: markdown, hint: "支持 Markdown；换行会按段落显示。" }
              - label: 导航菜单
                name: menu
                widget: list
                summary: "{{fields.label}} → {{fields.path}}"
                fields:
                  - { label: 显示文字, name: label, widget: string }
                  - { label: 链接路径, name: path, widget: string, hint: "相对站点根，如 /about/、/archives/" }
              - { label: 页脚版权, name: footer, widget: string }
          - label: 三、全站界面文案
            name: site_ui
            widget: object
            collapsed: true
            fields:
              - label: 站点信息（浏览器标题、SEO）
                name: meta
                widget: object
                collapsed: false
                fields:
                  - label: 网站标题（备用）
                    name: site_title
                    widget: string
                    required: false
                    hint: "若已设置站点名称，一般以站点名称为准；此处可作为未设置站点名称时的后备"
                  - { label: 站点描述, name: site_description, widget: markdown, hint: "支持 Markdown；用于页头 meta 时会自动转为纯文本摘要。" }
                  - label: 网站图标（浏览器标签）
                    name: favicon
                    widget: image
                    required: false
                    hint: "可选。上传 JPG/PNG/WebP 等方形小图；留空则使用仓库根目录 source/favicon.ico。保存后需重新构建站点。"
              - label: 首页列表区
                name: home
                widget: object
                collapsed: true
                fields:
                  - { label: 无障碍标题（首页「博客」）, name: sr_only_title, widget: string }
                  - { label: 「文库共 N 篇」前缀, name: stat_total_prefix, widget: string }
                  - { label: 篇数字单位, name: stat_unit, widget: string }
                  - { label: 统计中间点, name: stat_dot, widget: string }
                  - { label: 「本页 N 篇」前缀, name: stat_page_prefix, widget: string }
                  - { label: 侧栏「分类」标题, name: aside_categories_title, widget: string }
                  - { label: 侧栏「最新」标题, name: aside_latest_title, widget: string }
                  - { label: 侧栏 aria 说明, name: aside_aria_label, widget: string }
              - label: 分类汇总页 /categories/
                name: categories_page
                widget: object
                collapsed: true
                fields:
                  - { label: 页面大标题, name: page_title, widget: string }
                  - { label: 副标题说明, name: page_desc, widget: markdown, hint: "支持 Markdown。" }
                  - { label: 无分类时提示, name: empty_hint, widget: markdown, hint: "支持 Markdown；可写 `code` 或 **加粗**。" }
                  - { label: 「N 篇」后面后缀, name: articles_count_suffix, widget: string }
              - label: 通用标签（分页、未分类、更新 等）
                name: labels
                widget: object
                collapsed: true
                fields:
                  - { label: 未分类占位, name: uncategorized, widget: string }
                  - { label: 「更新」二字, name: updated, widget: string }
                  - { label: 浏览器标签里「博客」备用, name: head_fallback_blog, widget: string }
                  - { label: 标签页标题前缀, name: head_tag_prefix, widget: string }
                  - { label: 标签列表页标题前缀, name: tag_page_title_prefix, widget: string }
                  - { label: 分类列表页标题前缀, name: category_page_title_prefix, widget: string }
                  - { label: 上一页, name: pagination_prev, widget: string }
                  - { label: 下一页, name: pagination_next, widget: string }
                  - { label: 分页区域 aria, name: pagination_aria, widget: string }
                  - { label: 「置顶」角标（文章卡片/侧栏/归档）, name: pinned_label, widget: string, default: "置顶" }
              - label: 归档页
                name: archive
                widget: object
                collapsed: true
                fields:
                  - { label: 全站归档无障碍标题, name: sr_only_all, widget: string }
                  - { label: 无文章提示, name: empty_posts, widget: markdown, hint: "支持 Markdown。" }
                  - { label: 左侧目录标题, name: toc_title, widget: string }
              - label: 音乐页 /music-share/
                name: music_share_page
                widget: object
                collapsed: true
                fields:
                  - label: 页头说明（可选，若页面正文未写 description 则显示此项）
                    name: page_desc
                    widget: markdown
                    required: false
                    hint: "显示在标题下方；也可只在「音乐」页面 front-matter 里写 description。"
                  - label: 「置顶」标签文案
                    name: pinned_label
                    widget: string
                    default: 置顶
                    required: false
                    hint: "时间轴上置顶条目的角标（与全站「置顶角标」可二选一配置）。"
                  - label: 无条目时的提示
                    name: empty_hint
                    widget: markdown
                    required: false
                    hint: "当时间轴没有任何条目时展示。"
              - label: 宠物页 /pets/
                name: pets_page
                widget: object
                collapsed: true
                fields:
                  - label: 页头圆形头像
                    name: avatar
                    widget: image
                    required: false
                    hint: "显示在页面顶部（无大标题）；方形图即可，主题为圆形裁切。与宠物时间轴共用 uploads。"
                  - label: 页头说明（可选）
                    name: page_desc
                    widget: markdown
                    required: false
                    hint: "显示在头像下方；也可在「宠物」页 front-matter 里写 description。"
                  - label: 左侧时间大纲标题
                    name: outline_title
                    widget: string
                    default: 时间大纲
                    required: false
                    hint: "有记录时左侧可点击跳转到对应条目。"
                  - label: 「置顶」标签文案
                    name: pinned_label
                    widget: string
                    default: 置顶
                    required: false
                    hint: "时间轴与左侧大纲中置顶条目的角标。"
                  - label: 无条目时的提示
                    name: empty_hint
                    widget: markdown
                    required: false
                    hint: "当没有任何宠物记录时展示。"
              - label: 近况页 /news/
                name: news_page
                widget: object
                collapsed: true
                fields:
                  - label: 页头说明（可选）
                    name: page_desc
                    widget: markdown
                    required: false
                    hint: "显示在标题下方；也可在「近况」页 front-matter 里写 description。"
                  - label: 左侧时间大纲标题
                    name: outline_title
                    widget: string
                    default: 时间大纲
                    required: false
                    hint: "有记录时左侧可点击跳转到对应条目。"
                  - label: 「置顶」标签文案
                    name: pinned_label
                    widget: string
                    default: 置顶
                    required: false
                    hint: "时间轴与左侧大纲中置顶条目的角标文字。"
                  - label: 无条目时的提示
                    name: empty_hint
                    widget: markdown
                    required: false
                    hint: "当时间轴没有任何条目时展示。"
              - label: 顶栏无障碍
                name: header
                widget: object
                collapsed: true
                fields:
                  - { label: 首页链接, name: aria_home, widget: string }
                  - { label: 主导航区域, name: aria_nav, widget: string }
                  - { label: 移动端菜单按钮, name: nav_toggle_label, widget: string }
              - label: 顶栏 / 留言墙 · 天气小模块（固定城市实况）
                name: weather_chip
                widget: object
                collapsed: true
                fields:
                  - label: 开启
                    name: enable
                    widget: boolean
                    default: true
                    hint: "关闭后顶栏与留言墙均不显示。数据来自 Open-Meteo，访客浏览器直接请求，不写进文章。"
                  - label: 城市显示名
                    name: city_label
                    widget: string
                    default: "深圳"
                  - label: 纬度
                    name: latitude
                    widget: string
                    default: "22.5431"
                    hint: "小数；与经度一起决定实况。可地图搜索城市后复制坐标。"
                  - label: 经度
                    name: longitude
                    widget: string
                    default: "114.0579"
                  - label: 在留言墙页正文区再显示一块
                    name: show_on_guestbook
                    widget: boolean
                    default: true
                    hint: "开启时除顶栏外，留言墙标题说明下方再显示同款天气（仅 /guestbook/）。"
          - label: 四、留言墙（标题、说明与 Waline）
            name: guestbook
            widget: object
            collapsed: true
            fields:
              - label: 页面文案
                name: page
                widget: object
                collapsed: false
                fields:
                  - { label: 页面大标题, name: title, widget: string, default: "留言墙" }
                  - label: 说明段落
                    name: intro
                    widget: markdown
                    required: false
                    hint: "显示在标题下方、评论区上方；支持 Markdown 与换行。"
              - label: Waline
                name: waline
                widget: object
                collapsed: false
                fields:
                  - label: serverURL（后端地址，无末尾斜杠）
                    name: serverURL
                    widget: string
                    required: false
                    hint: "可填他人提供的 Waline 服务地址；自建见 https://waline.js.org/guide/get-started.html"
          - label: 五、顶栏音乐按钮（与「音乐时间轴」联动）
            name: music_player
            widget: object
            collapsed: true
            fields:
              - label: 开启顶栏音符播放器
                name: enable
                widget: boolean
                default: false
                hint: "开启后顶栏显示音符；播放内容与曲目名取自 **音乐时间轴** 里「日期最新」且已上传/填写音频的那一条，无需在此重复配置。"

