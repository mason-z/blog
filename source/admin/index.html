<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>内容管理</title>
</head>
<body>
  <!-- Decap CMS：主 CDN 用 jsDelivr（国内比 unpkg 更易加载）；失败则回退 unpkg -->

    src="https://cdn.jsdelivr.net/npm/decap-cms@3.4.0/dist/decap-cms.js"
    onerror="this.onerror=null;this.src='https://unpkg.com/decap-cms@3.4.0/dist/decap-cms.js'"
  ></script>
</body>
</html>
