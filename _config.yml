# 站点标题/描述：与 source/_data/site_cms.yml 保持语义一致（RSS、部分兜底用）；全站展示以后台「站点配置」为准
title: I'm Mason
subtitle: ''
description: Mason 的个人博客
keywords: blog
author: Mason
language: zh-CN
timezone: Asia/Shanghai

# 线上站点地址（https://，无末尾斜杠）；与 root 一起影响资源与链接路径；换域名时请与 Decap base_url、OAuth 回调一致
url: https://masonblog.pages.dev
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - admin/**

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: true

marked:
  gfm: true
  pedantic: false
  smartypants: true
  breaks: true

index_generator:
  path: ''
  per_page: 10
  order_by: -date

archive_generator:
  per_page: 0
  yearly: true
  monthly: true
  daily: false

category_generator:
  per_page: 10

tag_generator:
  per_page: 10

theme: tony-blog
