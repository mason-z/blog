title: I'm Tony
subtitle: ''
description: 个人随笔与记录
keywords: blog
author: Tony
language: zh-CN
timezone: Asia/Shanghai

# 线上站点地址（Netlify / 自定义域名等），无末尾斜杠；与 root 一起影响资源与链接路径
url: https://masonblog.netlify.app
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - admin/**

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: true

marked:
  gfm: true
  pedantic: false
  smartypants: true
  breaks: true

index_generator:
  path: ''
  per_page: 10
  order_by: -date

archive_generator:
  per_page: 0
  yearly: true
  monthly: true
  daily: false

category_generator:
  per_page: 10

tag_generator:
  per_page: 10

theme: tony-blog
