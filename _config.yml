title: I'm Tony
subtitle: ''
description: 个人随笔与记录
keywords: blog
author: Tony
language: zh-CN
timezone: Asia/Shanghai

# 线上（Gitee Pages 项目站）：https://用户名.gitee.io/仓库名/
url: https://zhangmingcong.gitee.io/mc
root: /mc/
permalink: :year/:month/:day/:title/
permalink_defaults:

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: true

marked:
  gfm: true
  pedantic: false
  smartypants: true
  breaks: true

index_generator:
  path: ''
  per_page: 10
  order_by: -date

archive_generator:
  per_page: 0
  yearly: true
  monthly: true
  daily: false

category_generator:
  per_page: 10

tag_generator:
  per_page: 10

theme: tony-blog

# 静态文件推送到分支 gitee-pages，在仓库「服务 → Gitee Pages」中选该分支、目录 /
deploy:
  type: git
  repo: https://gitee.com/zhangmingcong/mc.git
  branch: gitee-pages
  message: "update site"
